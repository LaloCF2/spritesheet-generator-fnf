<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generador GIF FNF'</title>

    <link rel="stylesheet" href="css/themes.css?v=2">
    <link rel="stylesheet" href="css/base.css?v=2">
    <link rel="stylesheet" href="css/layout.css?v=2">
    <link rel="stylesheet" href="css/components.css?v=2">
    <link rel="stylesheet" href="css/windows.css?v=2">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SpriteGen FNF">
    <link rel="apple-touch-icon" href="logo-192.png">

    <!-- gifshot for synchronous GIF encoding -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>

    <style>
        .gif-mode-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .gif-mode-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.2);
        }

        .gif-mode-card.selected {
            border-color: var(--accent);
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        .gif-mode-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: block;
        }
        
        .gif-mode-icon img {
            width: 64px;
            filter: brightness(0) invert(1);
        }

        .gif-mode-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            margin-bottom: 5px;
        }

        .gif-mode-desc {
            font-size: 0.8rem;
            color: #aaa;
        }

        .gif-modes-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        #gifWorkspace {
            display: none;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .preview-box {
            background: repeating-conic-gradient(#808080 0% 25%, transparent 0% 50%) 50% / 20px 20px;
            background-color: #a0a0a0;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        #previewGifImg {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        .bpm-slider-container {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .slider-label {
            flex-shrink: 0;
            color: #fff;
            font-weight: bold;
        }

        input[type=range] {
            flex-grow: 1;
            accent-color: var(--accent);
        }
    </style>
</head>

<body>
    <div id="globalLoader" class="global-loader">
        <div class="loader-content">
            <div class="ia-spinner"></div>
            <p id="globalLoaderText"
                style="color: white; font-weight: bold; margin-top: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
                Iniciando...</p>
        </div>
    </div>

    <div class="glass-bg">
        <div class="glass-blob blob-1"></div>
        <div class="glass-blob blob-2"></div>
        <div class="glass-blob blob-3"></div>
        <div class="glass-blob blob-4"></div>
    </div>

    <div class="app-header">
        <h1 class="app-title" onclick="location.reload()" style="cursor:pointer;" title="Recargar página">
            <img src="logo-192.png" class="icon logo-icon" alt="Logo">
            Spritesheet Generator FNF'
        </h1>

        <div class="window-nav">
            <button class="win-btn" onclick="window.location.href='index.html'"><img
                    src="https://cdn-icons-png.flaticon.com/128/4675/4675164.png" class="icon" alt="Inicio">
                Inicio</button>
            <button class="win-btn active"><img
                    src="https://cdn-icons-png.flaticon.com/512/1210/1210214.png" class="icon" alt="GIF">
                Generador GIF</button>
        </div>
    </div>

    <div class="main-container" style="overflow-y: auto; max-height: calc(100vh - 80px); padding-bottom: 100px;">
        <div class="tool-window shadow-pop" style="animation-delay: 0.1s; max-width: 900px; margin: 0 auto; display:block;">
            <div class="window-header">
                <div class="window-title">
                    <img src="https://cdn-icons-png.flaticon.com/512/1210/1210214.png" class="icon" alt="GIF" style="filter:invert(1)"> Generador de GIF Animado
                </div>
            </div>
            
            <div class="window-content" id="win-gif">
                <p style="color: #aaa; margin-bottom: 20px; font-size:0.9rem;">Sube tu hoja de sprites (.png) para crear la animación desde cero.</p>

                <div id="fileInputsContainer" style="display:flex; flex-direction:column; gap:15px; margin-bottom: 20px;">
                    <input type="file" id="gifPngUnicoUpload" class="hidden-file" accept="*/*" style="display:none;">
                    <button class="btn-pildora" style="width:100%; padding: 25px; font-size: 1.2rem; background: #31b0d1; color: #000; border:none; display:flex; align-items:center; justify-content:center; gap:15px; box-shadow: 0 4px 15px rgba(49, 176, 209, 0.4);" onclick="document.getElementById('gifPngUnicoUpload').click();">
                        <img src="https://cdn-icons-png.flaticon.com/512/716/716784.png" class="icon icon-black" alt="Upload" style="width:40px; height:40px;"> 
                        <div style="text-align:left;">
                            <b>CARGAR HOJA DE SPRITES (PNG)</b><br>
                            <span style="font-size:0.9rem; opacity:0.8;">Soporta navegación sin límite (Android)</span>
                        </div>
                    </button>
                </div>

                <div id="gifWorkspace">
                    
                    <div id="xmlAnimSelector" style="display:none; background:rgba(0,0,0,0.4); padding:15px; border-radius:8px;">
                        <label style="color:#fff; font-weight:bold; margin-right:10px;">Seleccionar Animación del XML:</label>
                        <select id="selectAnimacionXML" class="select-modern" style="min-width:200px;">
                            <option value="">Carga un XML primero...</option>
                        </select>
                    </div>

                    <!-- BPM / Velocidad Control -->
                    <div class="bpm-slider-container">
                        <div class="slider-label">Sincronización BPM (FNF): <span id="lblBpm">100</span> BPM</div>
                        <input type="range" id="sliderBpm" min="60" max="300" value="100" oninput="actualizarBPM()">
                        <div style="color:#aaa; font-size:0.8rem; margin-left:10px;" id="lblFps">(= 24 FPS)</div>
                    </div>
                    
                    <!-- MODO B: CORTADOR INTERACTIVO -->
                    <div id="gifCropContainer" style="display:none; margin-bottom: 20px;">
                        <label style="color:#fff; font-weight:bold; margin-bottom:10px; display:block;">Dibuja recuadros sobre los cuadros que deseas animar, en orden:</label>
                        <div style="position:relative; overflow:auto; max-height:400px; border:2px dashed #31b0d1; border-radius:8px; background:rgba(0,0,0,0.5);">
                            <canvas id="gifCropCanvas" style="cursor:crosshair; touch-action:none;"></canvas>
                        </div>
                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <button class="btn-pildora btn-secundario" style="flex:1; border-color:#ff3366; color:#ff3366;" onclick="limpiarCajasGif()">Borrar Recuadros</button>
                            <button class="btn-pildora btn-primario" style="flex:2; background:#31b0d1; color:#000; border-color:#31b0d1;" onclick="extraerFramesGif()">Extraer y Secuenciar</button>
                        </div>
                    </div>

                    <div class="preview-box">
                        <div style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6); padding:5px 10px; border-radius:5px; color:#fff; font-size:0.8rem; font-weight:bold;" id="txtFrameCount">0 Frames</div>
                        <img id="previewGifImg" src="" style="display:none;">
                        <div id="previewPlaceholder" style="color:#666; font-weight:bold; font-size:1.2rem;">VISTA PREVIA</div>
                    </div>

                    <!-- SECUENCIADOR DE FRAMES -->
                    <div id="gifSequencer" style="display:none; margin-top:20px; margin-bottom:20px;">
                        <label style="color:#fff; font-weight:bold; margin-bottom:10px; display:block;"><img src="https://cdn-icons-png.flaticon.com/128/833/833281.png" style="width:20px; filter:invert(1); vertical-align:middle;"> Secuenciador de Animación (Modificar Frames):</label>
                        <div id="gifSequencerTrack" style="display:flex; overflow-x:auto; background:rgba(0,0,0,0.4); padding:15px; border-radius:8px; gap:15px; min-height:120px; align-items:center;">
                            <!-- Se inyecta desde js -->
                        </div>
                    </div>

                    <button class="btn-pildora btn-primario" id="btnGenerarGif" style="width:100%; font-size:1.2rem; padding:15px; display:none;" onclick="generarGif()">
                        <img src="https://cdn-icons-png.flaticon.com/512/1210/1210214.png" class="icon" style="filter:invert(1);">
                        EXPORTAR COMO GIF
                    </button>
                    
                    <a id="btnDescargarGif" class="btn-pildora btn-secundario" style="width:100%; font-size:1.2rem; padding:15px; display:none; text-align:center; text-decoration:none; border-color:var(--accent-green); color:var(--accent-green);">
                        <img src="https://cdn-icons-png.flaticon.com/512/1159/1159330.png" class="icon" style="filter:invert(50%) sepia(90%) saturate(1350%) hue-rotate(90deg) brightness(100%) contrast(100%);">
                        Descargar GIF Generado
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL HISTORIAL -->
    <div class="overlay-modal" id="historyModal" style="display:none;">
        <div class="modal-box">
            <h2 class="modal-title"><img src="https://cdn-icons-png.flaticon.com/128/2088/2088617.png"
                    style="width:30px; filter:brightness(0) invert(1);"> Sesión Anterior</h2>
            <div class="modal-body" id="historyModalContent">
                <!-- Se inyecta desde js -->
            </div>
            <button class="btn-pildora btn-secundario" style="width:100%; margin-top:20px;"
                onclick="closeHistoryModal()">Cancelar</button>
        </div>
    </div>

    <!-- Theme Modal -->
    <div class="overlay-modal" id="themeModal" style="display: none;">
        <div class="modal-content">
            <h2 class="modal-title"><img src="https://cdn-icons-png.flaticon.com/128/893/893322.png"
                    style="width:30px; filter:brightness(0) invert(1);"> Personalizar Tema</h2>
            <div class="modal-body">
                <p>Elige tu color de acento favorito:</p>
                <div class="theme-colors">
                    <div class="color-btn" style="background: #00e5ff" onclick="setThemeColor('cyan')"></div>
                    <div class="color-btn" style="background: #ff007f" onclick="setThemeColor('pink')"></div>
                    <div class="color-btn" style="background: #a800ff" onclick="setThemeColor('purple')"></div>
                    <div class="color-btn" style="background: #00ff88" onclick="setThemeColor('green')"></div>
                    <div class="color-btn" style="background: #ffaa00" onclick="setThemeColor('orange')"></div>
                </div>
            </div>
            <button class="btn-pildora btn-secundario" style="width:100%; margin-top:20px;"
                onclick="closeThemeModal()">Cerrar</button>
        </div>
    </div>

    <!-- FAB WRAPPER: MODO OSCURO -->
    <div class="fab-wrap-dark">
        <button class="fab-btn darkmode-btn" onclick="toggleDarkMode()" title="Modo Oscuro/Claro">
            <img src="https://cdn-icons-png.flaticon.com/128/11885/11885172.png" id="darkModeIcon"
                class="icon-sm icon-black" alt="Dark Mode">
        </button>
    </div>

    <!-- FAB WRAPPER: HISTORIAL -->
    <div class="fab-wrap-history">
        <button class="fab-btn history-btn" onclick="showHistoryModal()" title="Historial / Autoguardado"
            style="background: rgba(255,170,0,0.6);">
            <img src="https://cdn-icons-png.flaticon.com/128/2088/2088617.png" class="icon-sm icon-black"
                alt="History">
        </button>
    </div>

    <!-- FAB WRAPPER: TEMA -->
    <div class="fab-wrap-theme">
        <button class="fab-btn theme-btn" onclick="toggleThemeMenu()" title="Cambiar Tema">
            <img src="https://cdn-icons-png.flaticon.com/128/893/893322.png" class="icon-sm icon-black" alt="Theme">
        </button>
        <div class="fab-menu" id="fabThemeMenu">
            <button class="fab-item" onclick="changeTheme('cyberpunk'); toggleThemeMenu();">
                <span class="fab-color-dot" style="background: #f1a9d4;"></span> Pastel (Predeterminado)
            </button>
            <button class="fab-item" onclick="changeTheme('psych'); toggleThemeMenu();">
                <span class="fab-color-dot" style="background: #aaff00;"></span> Tema Psych
            </button>
            <button class="fab-item" onclick="changeTheme('bf'); toggleThemeMenu();">
                <span class="fab-color-dot" style="background: #31b0d1;"></span> Tema BF
            </button>
        </div>
    </div>

    <script src="js/history.js?v=2"></script>
    <script src="js/main.js?v=2" defer></script>
    <script src="js/generador_gif.js?v=2" defer></script>
    <script>window.addEventListener("DOMContentLoaded", () => { appMode = "GIF"; if (typeof toggleNavButtons === "function") toggleNavButtons(); if (typeof openWindow === "function") openWindow("win-gif"); setTimeout(()=>{ if(typeof seleccionarModo === "function") seleccionarModo("B"); }, 100); });</script>
</body>
</html>
